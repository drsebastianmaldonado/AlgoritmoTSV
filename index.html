<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSV Diagnóstico - Algoritmo Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Estilo para el botón flotante de WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            border-radius: 50px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }
        .whatsapp-float:hover {
            transform: scale(1.05);
            background-color: #128c7e;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .whatsapp-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8">

    <!-- Botón Flotante de WhatsApp con SVG y Mensaje Predeterminado Mejorado -->
    <a href="https://wa.me/5491131860600?text=Hola%20Doctor%2C%20lo%20contacto%20a%20desde%20la%20aplicaci%C3%B3n%20de%20TSV%20para%20realizarle%20una%20interconsulta%20sobre%20un%20caso%20cl%C3%ADnico." class="whatsapp-float" target="_blank" title="Contactar por WhatsApp">
        <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <!-- Icono oficial de WhatsApp SVG -->
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.1 0-65.6-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.1-16.4-14.6-27.4-32.7-30.6-38.1-3.2-5.5-.3-8.4 2.4-11.2 2.5-2.5 5.5-6.4 8.3-9.7 2.8-3.3 3.7-5.7 5.5-9.4 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
        </svg>
        <span class="ml-2 font-bold text-sm tracking-tight hidden sm:inline">Consultar al Doctor</span>
    </a>

    <div id="app" class="max-w-2xl mx-auto pb-24">
        <!-- El contenido se genera vía JavaScript -->
    </div>

    <script>
        const algorithm = {
            inicio: {
                question: "¿La taquicardia es Regular o Irregular?",
                options: [
                    { label: "Regular", next: "regular_p_presente" },
                    { label: "Irregular", next: "irregular_p_presente" }
                ]
            },
            irregular_p_presente: {
                question: "¿Hay onda P presente?",
                options: [
                    { label: "No", next: "irregular_serrucho" },
                    { label: "Sí", next: "irregular_morfologias" }
                ]
            },
            irregular_serrucho: {
                question: "¿Ondas en serrucho?",
                options: [
                    { label: "Sí", diagnosis: "AA (Flutter Auricular)" },
                    { label: "No", diagnosis: "FA (Fibrilación Auricular)" }
                ]
            },
            irregular_morfologias: {
                question: "¿3 o más morfologías de onda P?",
                options: [
                    { label: "Sí", diagnosis: "TAM (Taquicardia Auricular Multifocal)" },
                    { label: "No", next: "irregular_disociacion" }
                ]
            },
            irregular_disociacion: {
                question: "¿Existe disociación AV?",
                options: [
                    { label: "Sí", diagnosis: "JET (Taquicardia Ectópica de la Unión)" },
                    { label: "No", diagnosis: "TA (Taquicardia Auricular)" }
                ]
            },
            regular_p_presente: {
                question: "¿Hay onda P presente?",
                options: [
                    { label: "No", next: "regular_no_p_maniobras" },
                    { label: "Sí", next: "regular_av_2_1" }
                ]
            },
            regular_no_p_maniobras: {
                question: "Diagnóstico inicial sugerido:<br>1° TRIN típica<br>2° JET<br><br>Realizar Maniobras Vagales o Adenosina. ¿Qué respuesta se obtuvo?",
                options: [
                    { label: "Termina la taquicardia", diagnosis: "TRIN típica" },
                    { label: "Disociación AV o Fenómeno de Wenckebach", next: "regular_no_p_va" }
                ]
            },
            regular_no_p_va: {
                question: "Evaluar la relación entre Ventrículos (V) y Aurículas (A):",
                options: [
                    { label: "V > A", diagnosis: "JET (Taquicardia Ectópica de la Unión)" },
                    { label: "A > V", diagnosis: "TA (Taquicardia Auricular con PR largo)" }
                ]
            },
            regular_av_2_1: {
                question: "¿La relación de conducción AV es 2:1?",
                options: [
                    { label: "Sí", next: "regular_2_1_inf" },
                    { label: "No (Relación 1:1)", next: "regular_rp_pr" }
                ]
            },
            regular_2_1_inf: {
                question: "¿La onda P es negativa en cara inferior (DII, DIII, aVF)?",
                options: [
                    { label: "No", diagnosis: "TA (Taquicardia Auricular)" },
                    { label: "Sí", next: "regular_2_1_adenosina" }
                ]
            },
            regular_2_1_adenosina: {
                question: "Diagnóstico diferencial Taquicardia/Aleteo Auricular o TRIN típica. Evaluar respuesta a Maniobras Vagales / Adenosina:",
                options: [
                    { label: "Termina la taquicardia", diagnosis: "1° TRIN típica<br>2° TA Adenosina Sensible" },
                    { label: "Disociación AV o Fenómeno de Wenckebach", next: "regular_2_1_serrucho" }
                ]
            },
            regular_2_1_serrucho: {
                question: "¿Se observan ondas en serrucho al bloquear el nodo AV?",
                options: [
                    { label: "Sí", diagnosis: "AA (Flutter Auricular)" },
                    { label: "No", diagnosis: "TA (Taquicardia Auricular)" }
                ]
            },
            regular_rp_pr: {
                question: "¿El intervalo RP es menor que el PR?",
                options: [
                    { label: "Sí (RP Corto)", next: "regular_rp_80" },
                    { label: "No (RP Largo)", next: "regular_rp_largo_adenosina" }
                ]
            },
            regular_rp_80: {
                question: "¿El intervalo RP es < 80 ms?",
                options: [
                    { label: "Sí", next: "regular_no_p_maniobras" },
                    { label: "No (> 80 ms)", next: "regular_trav_adenosina" }
                ]
            },
            regular_trav_adenosina: {
                question: "Posible TRAV o TA con PR prolongado. Evaluar respuesta a Adenosina:",
                options: [
                    { label: "Termina la taquicardia", diagnosis: "TRAV (Taquicardia Reentrada AV)" },
                    { label: "Persiste actividad auricular (Wenckebach/Disociación)", diagnosis: "TA con PR prolongado" }
                ]
            },
            regular_rp_largo_adenosina: {
                question: "Posible PJRT / TRIN atípica / TA. Evaluar respuesta a Adenosina:",
                options: [
                    { label: "Termina la taquicardia", diagnosis: "PJRT o TRIN Atípica" },
                    { label: "Persiste actividad auricular", diagnosis: "TA (Taquicardia Auricular)" }
                ]
            }
        };

        let currentStep = 'inicio';
        let history = [];

        function render() {
            const app = document.getElementById('app');
            const stepData = algorithm[currentStep];
            const isDiagnosis = typeof currentStep === 'object' && currentStep.type === 'diagnosis';

            let content = `
                <header class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-2xl font-black text-gray-900 tracking-tight">TSV<span class="text-blue-600">Diagnóstico</span></h1>
                        <p class="text-sm text-gray-500 font-medium italic">QRS Estrecho (&lt; 120ms)</p>
                    </div>
                    <div class="flex gap-2">
                        ${history.length > 0 ? `<button onclick="handleBack()" class="p-2 bg-white border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors shadow-sm"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>` : ''}
                        <button onclick="handleReset()" class="p-2 bg-white border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors shadow-sm"><i data-lucide="refresh-ccw" class="w-5 h-5"></i></button>
                    </div>
                </header>

                <main class="bg-white rounded-[2rem] shadow-2xl shadow-blue-900/5 border border-gray-100 p-8 md:p-12 relative overflow-hidden fade-in">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -mr-16 -mt-16 opacity-50"></div>
            `;

            if (isDiagnosis) {
                content += `
                    <div class="flex flex-col items-center">
                        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                            <i data-lucide="activity" class="w-10 h-10 text-blue-600"></i>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-500 mb-2 uppercase tracking-wider text-center">Diagnóstico Sugerido</h2>
                        <div class="bg-blue-600 text-white text-2xl md:text-3xl font-bold p-8 rounded-2xl shadow-xl text-center mb-8 w-full leading-relaxed">
                            ${currentStep.value}
                        </div>
                        <button onclick="handleReset()" class="flex items-center gap-2 bg-gray-800 text-white px-8 py-4 rounded-xl font-semibold hover:bg-gray-700 transition-all shadow-lg active:scale-95">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Nuevo Análisis
                        </button>
                    </div>
                `;
            } else {
                content += `
                    <div class="mb-8">
                        <div class="flex items-center gap-2 text-blue-600 mb-2">
                            <i data-lucide="info" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">Paso ${history.length + 1}</span>
                        </div>
                        <h2 class="text-2xl md:text-3xl font-bold text-gray-800 leading-tight">${stepData.question}</h2>
                    </div>
                    <div class="grid gap-4">
                        ${stepData.options.map((opt, i) => `
                            <button onclick="handleOptionClick(${i})" class="group flex items-center justify-between p-6 bg-white border-2 border-gray-100 rounded-2xl text-left hover:border-blue-500 hover:bg-blue-50 transition-all shadow-sm active:scale-[0.99]">
                                <span class="text-lg font-medium text-gray-700 group-hover:text-blue-700">${opt.label}</span>
                                <i data-lucide="chevron-right" class="w-6 h-6 text-gray-400 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            content += `
                </main>
                <footer class="mt-12 text-center max-w-md mx-auto">
                    <p class="text-[10px] text-gray-400 font-medium tracking-wide leading-relaxed uppercase">
                        Esta herramienta es exclusivamente para apoyo académico y formación médica. No sustituye el juicio de un profesional de la salud.
                    </p>
                </footer>
            `;

            app.innerHTML = content;
            lucide.createIcons();
        }

        function handleOptionClick(index) {
            const currentStepData = algorithm[currentStep];
            if (!currentStepData) return;
            
            const option = currentStepData.options[index];
            history.push(currentStep);
            
            if (option.diagnosis) {
                currentStep = { type: 'diagnosis', value: option.diagnosis };
            } else {
                currentStep = option.next;
            }
            render();
        }

        function handleBack() {
            if (history.length > 0) {
                currentStep = history.pop();
                render();
            }
        }

        function handleReset() {
            currentStep = 'inicio';
            history = [];
            render();
        }

        window.onload = render;
    </script>
</body>
</html>
